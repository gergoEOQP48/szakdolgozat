<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <p><a href="/">&larr; Vissza</a></p>
        <h2>{{ product.name }}</h2>
        <p>Célár: {{ product.target_price }} Ft</p>
        
        <div style="width: 100%; max-width: 900px; margin-top: 20px;">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    
    <script type="application/json" id="history-data">
        {{ history_json | safe }}
    </script>

    <script>
        
        const rawData = JSON.parse(document.getElementById('history-data').textContent);

        const labels = [...new Set(rawData.map(x => x.checked_at))];
        const shops = [...new Set(rawData.map(x => x.shop_name))];
        
        const datasets = shops.map((shop, i) => {
            const hue = Math.round((i * 360) / shops.length);
            const color = `hsl(${hue}, 75%, 45%)`;

            const data = labels.map(d => {
                const found = rawData.find(x => x.checked_at === d && x.shop_name === shop);
                return found ? found.price : null;
            });

            return {
                label: shop,
                data: data,
                borderColor: color,
                backgroundColor: color,
                fill: false,
                tension: 0.1,
                spanGaps: true
            };
        });

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: { responsive: true }
        });
    </script>
</body>
</html>
